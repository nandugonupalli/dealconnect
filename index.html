    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- INLINE CRITICAL CSS — Prevents FOUC                          -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <style>
      /* Base reset */
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #F8FAFC;
        color: #0F172A;
      }

      /* Dark mode base */
      html.dark body {
        background-color: #0F172A;
        color: #F1F5F9;
      }

      /* Loading screen */
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1E40AF 0%, #1E3A8A 100%);
        z-index: 9999;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }

      #initial-loader.fade-out {
        opacity: 0;
        visibility: hidden;
      }

      .loader-logo {
        width: 80px;
        height: 80px;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        font-weight: 800;
        color: #FFFFFF;
        margin-bottom: 24px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      }

      .loader-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255, 255, 255, 0.2);
        border-top-color: #FFFFFF;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      .loader-text {
        color: #FFFFFF;
        font-size: 14px;
        margin-top: 16px;
        opacity: 0.8;
        letter-spacing: 0.05em;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* Fade in app when loaded */
      #root {
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      #root.loaded {
        opacity: 1;
      }

      /* Prevent layout shift */
      body {
        min-height: 100vh;
        overflow-x: hidden;
      }

      /* Selection color */
      ::selection {
        background-color: #1E40AF;
        color: white;
      }

      /* Scrollbar styling */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      ::-webkit-scrollbar-track {
        background: #F1F5F9;
      }

      ::-webkit-scrollbar-thumb {
        background: #CBD5E1;
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #94A3B8;
      }

      /* Focus visible outline */
      :focus-visible {
        outline: 2px solid #1E40AF;
        outline-offset: 2px;
      }
    </style>
  </head>

  <body>
    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- INITIAL LOADER — Shows while React loads                     -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <div id="initial-loader" aria-label="Loading DealConnect" role="status">
      <div class="loader-logo">D</div>
      <div class="loader-spinner" aria-hidden="true"></div>
      <div class="loader-text">Loading DealConnect...</div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- REACT ROOT                                                   -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <noscript>
      <div style="padding: 40px; text-align: center; font-family: system-ui;">
        <h1 style="font-size: 24px; margin-bottom: 16px;">JavaScript Required</h1>
        <p>DealConnect requires JavaScript to run. Please enable JavaScript in your browser settings.</p>
      </div>
    </noscript>

    <div id="root"></div>

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- ENTRY SCRIPT                                                 -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- LOADER DISMISSAL SCRIPT                                      -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <script>
      (function () {
        // Dismiss loader when React mounts
        const dismissLoader = () => {
          const loader = document.getElementById('initial-loader');
          const root = document.getElementById('root');
          if (loader) {
            loader.classList.add('fade-out');
            setTimeout(() => loader.remove(), 400);
          }
          if (root) root.classList.add('loaded');
        };

        // Watch for React mounting
        const observer = new MutationObserver((mutations, obs) => {
          const root = document.getElementById('root');
          if (root && root.children.length > 0) {
            dismissLoader();
            obs.disconnect();
          }
        });

        observer.observe(document.getElementById('root') || document.body, {
          childList: true,
          subtree: true,
        });

        // Failsafe — dismiss after 5 seconds anyway
        setTimeout(dismissLoader, 5000);

        // Global error handler
        window.addEventListener('error', (e) => {
          console.error('[DealConnect Error]', e.error || e.message);
        });

        window.addEventListener('unhandledrejection', (e) => {
          console.error('[DealConnect Unhandled Promise]', e.reason);
        });
      })();
    </script>
  </body>
</html>
